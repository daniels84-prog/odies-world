<title>Odie's World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: one-screen workshop. Name strip on top, pegboard wall with the workpiece in the middle, tool rack along the bottom. Single committed dark workshop look. */
:root{
  --wall:#2a2420;
  --peg:#16120f;
  --rack:#3b2d21;
  --rack-edge:#56412f;
  --yellow:#f6b417;
  --ink:#fff4de;
  --muted:#cdb89a;
  --dark-ink:#231910;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--wall);color:var(--ink);font-family:var(--body);
  overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;
}
header{display:flex;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.4vw,26px);margin:0;flex:1;min-width:0;letter-spacing:.02em;color:var(--yellow);text-wrap:balance;line-height:1}
h1 span{color:var(--ink)}
.face{width:48px;height:48px;flex:none;display:block}
@media (max-width:420px){.hbtn{font-size:13px;padding:8px 9px}}
.hbtn{
  font-family:var(--body);font-weight:900;font-size:14px;color:var(--ink);
  background:var(--rack);border:2px solid var(--rack-edge);border-radius:12px;
  padding:8px 10px;cursor:pointer;min-height:40px;white-space:nowrap;
}
.hbtn:active{transform:translateY(2px)}
.hbtn:focus-visible,.tool:focus-visible,.sw:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.stage{
  position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  background:
    radial-gradient(circle,var(--peg) 3px,transparent 3.6px) 0 0/26px 26px,
    linear-gradient(180deg,#4a3a2c,#3a2d22);
  box-shadow:inset 0 0 0 3px #1e1813, inset 0 -40px 60px rgba(0,0,0,.35);
}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(22,18,15,.82);color:var(--ink);font-weight:900;font-size:17px;
  padding:8px 16px;border-radius:999px;white-space:nowrap;pointer-events:none;
  transition:opacity .5s;
}
.hint.gone{opacity:0}
.swatches{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  display:flex;gap:8px;padding:8px;background:rgba(22,18,15,.82);border-radius:999px;
}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
nav{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--rack);border:2px solid var(--rack-edge);border-radius:16px;
  padding:6px 1px 8px;color:var(--ink);cursor:pointer;min-width:0;
  font-family:var(--display);font-size:clamp(8px,2.2vw,12px);letter-spacing:.02em;
  transition:transform .15s, background .15s;
}
.tool svg{width:34px;height:34px}
.tool.on{background:var(--yellow);border-color:#ffd56a;color:var(--dark-ink);transform:translateY(-5px);box-shadow:0 6px 0 #a87406}
@media (prefers-reduced-motion:reduce){.tool,.hint{transition:none}}
header{gap:8px}
.icon-btn{display:flex;align-items:center;justify-content:center;width:44px;padding:0}
.icon-btn svg{width:22px;height:22px}
@media (max-width:420px){header.inplace .face{display:none}}
.stage[data-place="home"]{background:linear-gradient(180deg,#8fc7e8 0%,#c5e6f3 40%,#7cb752 40.5%,#4f8a3a 100%)}
.stage[data-place="pond"]{background:#3f7a33}
.stage[data-place="yard"]{background:#0b1530}
.home{
  position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;padding:16px;align-content:center;overflow:auto;box-sizing:border-box;
}
.place{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:150px;padding:16px 8px;border-radius:22px;border:3px solid #1e1813;
  font-family:var(--display);font-size:clamp(14px,4.2vw,20px);color:var(--ink);letter-spacing:.02em;
  cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center;line-height:1.1;
}
.place svg{width:min(92px,24vw);height:auto}
.place:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.place:focus-visible,.lb:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.place small{font-family:var(--body);font-weight:900;font-size:12px;letter-spacing:0;color:var(--ink);opacity:.9}
.place.workshop{background:linear-gradient(180deg,#5a4330,#3b2d21)}
.place.pond{background:linear-gradient(180deg,#3d8fb8,#23607e)}
.place.yard{background:linear-gradient(180deg,#5f9a44,#3e6e2c)}
.place.science{background:linear-gradient(180deg,#6b4bb8,#43307a)}
.stage[data-place="science"]{background:#1b2433}
.place.farm{background:linear-gradient(180deg,#b5483a,#7e2d24)}
.place.soon{filter:saturate(.55);opacity:.8}
nav.tray{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
nav.tray.few{max-width:340px;width:100%;margin-inline:auto}
.picker{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;background:rgba(10,30,36,.78);border-radius:20px;
  width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;
}
#lures{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#3a8a9a,#1f5a66);border:3px solid #123c45;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:box-shadow .15s}
#lures.drop{box-shadow:0 0 0 4px #ffd34d,0 6px 0 rgba(0,0,0,.35)}
#lures .lb{background:rgba(0,20,25,.35);border:2px solid rgba(0,0,0,.25);border-radius:9px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
#lures .lb.out svg{opacity:.25}
#lures::-webkit-scrollbar{display:none}
#digPick{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;background:linear-gradient(180deg,#8a5a34,#5a3820);border:3px solid #3a2414;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#digPick::-webkit-scrollbar{display:none}
#digPick .lb{width:50px;height:50px;flex:none;background:rgba(30,15,5,.35);border:2px solid rgba(0,0,0,.25);border-radius:9px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
#digPick .lb svg{width:40px;height:40px}
#digPick .lb.out svg{opacity:.25}
.boxtabs{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:92px;display:flex;gap:6px}
.tab{background:#1f5a66;border-color:#123c45;opacity:.75}
.boxname{display:flex;align-items:center;padding:0 12px;min-height:40px;border-radius:12px;background:rgba(10,30,36,.85);color:var(--ink);font-weight:900;font-size:14px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.boxtabs{bottom:142px}}
.tab.on{background:#3a8a9a;border-color:#ffd34d;opacity:1}
.hammerbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;font-size:18px;padding:12px 26px;background:#2f8a3a;border-color:#1f5a26;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.hammerbtn.on{background:#c8362c;border-color:#8a1f18}
.lurebtns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:92px;display:flex;gap:8px}
.putaway{background:#1f5a66;border-color:#123c45;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.dirtbtn{background:#6e4526;border-color:#3a2414}
.dirttab{background:#5a3820;border-color:#3a2414}
.dirttab.on{background:#a8743e;border-color:#ffd34d}
#lures .lb{width:50px;height:50px;flex:none}
#lures .lb svg{width:40px;height:40px}
.lb{width:52px;height:52px;border-radius:14px;border:3px solid transparent;background:rgba(255,255,255,.08);padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb svg{width:42px;height:42px}
.lb.on{border-color:var(--ink);background:rgba(255,255,255,.2)}
</style>

<div class="app">
  <header id="hdr">

    </button>

    </svg>
    <h1 id="title">Odie's <span>World</span></h1>
    <button class="hbtn" id="newBtn" type="button" hidden>New board</button>
    <button class="hbtn icon-btn" id="sndBtn" type="button" aria-pressed="true" aria-label="Sound">
      <svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path id="sndOn" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><path id="sndOff" d="M15.5 9l5.5 6M21 9l-5.5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" visibility="hidden"/></svg>
    </button>
  </header>

  <div class="stage" id="stage" data-place="home">
    <canvas id="cv" aria-label="Play area"></canvas>
    <div class="hint gone" id="hint"></div>
    <div class="swatches" id="swatches" hidden></div>
    <div class="picker" id="lures" hidden></div>
    <div class="boxtabs" id="boxTabs" hidden><button class="hbtn tab on" id="boxPrev" type="button" aria-label="Previous tackle box">&#9664;</button><span class="boxname" id="boxName">Box 1</span><button class="hbtn tab on" id="boxNext" type="button" aria-label="Next tackle box">&#9654;</button></div>
    <div class="lurebtns" id="lureBtns" hidden>
      <button class="hbtn putaway" id="takeOut" type="button">Take all out</button>
      <button class="hbtn putaway" id="putAway" type="button">Put all away</button>
    </div>
    <div class="picker" id="pans" hidden></div>
    <div class="picker" id="weldTools" hidden></div>
    <div class="picker" id="mowerPick" hidden></div>
    <div class="picker" id="digPick" hidden></div>
    <div class="boxtabs" id="digTabs" hidden><button class="hbtn tab dirttab on" id="digTabW" type="button">Worm box</button><button class="hbtn tab dirttab" id="digTabM" type="button">Mole box</button></div>
    <div class="lurebtns" id="digBtns" hidden>
      <button class="hbtn putaway dirtbtn" id="wormsOut" type="button">All worms out</button>
      <button class="hbtn putaway dirtbtn" id="wormsIn" type="button">All worms in</button>
    </div>
    <button class="hbtn hammerbtn" id="hammerBtn" type="button" hidden>Start hammer</button>
    <div class="home" id="home">
      <button class="place workshop" type="button" data-place="workshop" id="p-workshop">
        <svg viewBox="0 0 48 48"><g transform="rotate(-38 24 24)" stroke="#2a1e16" stroke-width="2" stroke-linejoin="round"><rect x="19.5" y="18" width="9" height="28" rx="4" fill="#f2a43c"/><rect x="19.5" y="39" width="9" height="7" rx="3.5" fill="#c4632a"/><path d="M27 6 C35 4 41 10 43 20 C37 14 32 13 27 15 Z" fill="#7d868f"/><rect x="11" y="4" width="17" height="15" rx="2" fill="#9aa3ab"/><rect x="7" y="7" width="5" height="9" fill="#6f7880"/><rect x="3" y="5.5" width="5" height="12" rx="2" fill="#a9b1b8"/></g><path d="M38 34l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#ffd34d"/></svg>
        Workshop
      </button>
      <button class="place pond" type="button" data-place="pond" id="p-pond">
        <svg viewBox="0 0 48 48"><g stroke="#1e3a14" stroke-width="2"><ellipse cx="24" cy="31" rx="18" ry="12" fill="#6fbf45"/><circle cx="15" cy="18" r="7" fill="#6fbf45"/><circle cx="33" cy="18" r="7" fill="#6fbf45"/></g><circle cx="15" cy="18" r="3.6" fill="#f2d35a"/><circle cx="33" cy="18" r="3.6" fill="#f2d35a"/><rect x="12.5" y="17" width="5" height="2.2" rx="1" fill="#111"/><rect x="30.5" y="17" width="5" height="2.2" rx="1" fill="#111"/><path d="M13 32 Q24 39 35 32" fill="none" stroke="#1e3a14" stroke-width="2.2" stroke-linecap="round"/><circle cx="18" cy="27" r="1.2" fill="#1e3a14"/><circle cx="30" cy="27" r="1.2" fill="#1e3a14"/></svg>

        Yard
      </button>
      <button class="place science" type="button" data-place="science" id="p-science">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="19" r="15" fill="#ffe58a" opacity=".35"/><path d="M15 19 a9 9 0 1 1 18 0 c0 4 -3 6 -4 9 h-10 c-1 -3 -4 -5 -4 -9z" fill="#fff3b0" stroke="#2a1e16" stroke-width="2" stroke-linejoin="round"/><path d="M20 28 L20 22 L24 25 L28 22 L28 28" fill="none" stroke="#e8902a" stroke-width="1.6"/><rect x="19" y="29" width="10" height="7" rx="2" fill="#a8b0b8" stroke="#2a1e16" stroke-width="2"/><path d="M21 38 h6" stroke="#2a1e16" stroke-width="2.4" stroke-linecap="round"/><path d="M6 8 l3 2 M42 8 l-3 2 M4 20 h4 M44 20 h-4" stroke="#ffe58a" stroke-width="2.4" stroke-linecap="round"/></svg>
        Science
      </button>
    </div>
  </div>

  <nav class="tray few" id="tray-science" data-place="science" hidden>
    <button class="tool" data-tool="generator" type="button" id="t-generator">
      <svg viewBox="0 0 48 48"><circle cx="16" cy="32" r="11" fill="#e0b04a" stroke="#8a6420" stroke-width="2" stroke-dasharray="3 1.5"/><circle cx="16" cy="32" r="3" fill="#6f7880"/><path d="M16 32 L24 26" stroke="#5a636b" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="26" r="3.2" fill="#d8392c"/><path d="M30 14 a7 7 0 1 1 12 0 c0 3 -2 4 -3 7 h-6 c-1 -3 -3 -4 -3 -7z" fill="#fff3b0" stroke="#2a1e16" stroke-width="1.6"/><rect x="33" y="21" width="6" height="4" fill="#a8b0b8"/><path d="M27 34 Q34 34 35 26" fill="none" stroke="#d8392c" stroke-width="2"/></svg>

      Water wheel
    </button>
  </nav>

  <nav class="tray few" id="tray-yard" data-place="yard" hidden>
    <button class="tool" data-tool="fireflies" type="button" id="t-fireflies">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#e8ff8a" opacity=".18"/><circle cx="24" cy="24" r="12" fill="#e8ff8a" opacity=".3"/><ellipse cx="18" cy="16" rx="7" ry="4" fill="#c8d2e6" opacity=".85" transform="rotate(-30 18 16)"/><ellipse cx="30" cy="16" rx="7" ry="4" fill="#c8d2e6" opacity=".85" transform="rotate(30 30 16)"/><ellipse cx="24" cy="19" rx="4" ry="6" fill="#2a241e"/><ellipse cx="24" cy="29" rx="5" ry="7" fill="#f2ff7a"/><circle cx="24" cy="12" r="3" fill="#2a241e"/></svg>
      Lightning bugs
    </button>
    <button class="tool" data-tool="chickens" type="button" id="t-chickens">
      <svg viewBox="0 0 48 48"><g stroke="#2a1e16" stroke-width="1.6" stroke-linejoin="round"><path d="M8 22 Q6 10 14 14 Q12 20 16 24Z" fill="#b07e38"/><ellipse cx="22" cy="28" rx="13" ry="9" fill="#f7f3ea"/><circle cx="33" cy="15" r="6" fill="#f7f3ea"/><path d="M30 20 Q34 24 32 27 L27 24Z" fill="#f7f3ea" stroke="none"/></g><circle cx="31" cy="9" r="2" fill="#e23b2e"/><circle cx="34" cy="8.5" r="2.2" fill="#e23b2e"/><path d="M38 14 L43 16 L38 18Z" fill="#f2b02a"/><circle cx="35" cy="14" r="1.2" fill="#111"/><ellipse cx="37.5" cy="21" rx="1.3" ry="2.2" fill="#e23b2e"/><ellipse cx="20" cy="28" rx="7" ry="4" fill="#d9d2c2"/><path d="M19 37 v6 M25 37 v6" stroke="#e8a33a" stroke-width="2"/><ellipse cx="40" cy="40" rx="4.5" ry="6" fill="#d9a477" stroke="#2a1e16" stroke-width="1.2"/></svg>
      Chickens

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const hintEl = document.getElementById('hint');
const swEl = document.getElementById('swatches');
const luresEl = document.getElementById('lures');
const pansEl = document.getElementById('pans');
const weldEl = document.getElementById('weldTools');
const mowerEl = document.getElementById('mowerPick');
const digEl = document.getElementById('digPick');
let W = 0, H = 0, DPR = 1, now = 0;

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
}

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const inB = (b, p, pad = 0) => p.x > b.x - pad && p.x < b.x + b.w + pad && p.y > b.y - pad && p.y < b.y + b.h + pad;
function boardRect(aspect) {
  const bw = Math.min(W * 0.86, 640);
  const bh = Math.min(bw * aspect, H * 0.6);
  return { x: (W - bw) / 2, y: (H - bh) / 2 + H * 0.05, w: bw, h: bh };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * DPR)); c.height = Math.max(1, Math.round(h * DPR));
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  return { c, g };
}
function woodTex(w, h, hue, light = 60) {
  const { c, g } = makeCanvas(w, h);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, `hsl(${hue},58%,${light + 4}%)`);
  grad.addColorStop(1, `hsl(${hue},52%,${light - 6}%)`);
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  for (let i = 0; i < h / 2.5; i++) {
    const y = Math.random() * h;
    g.strokeStyle = `hsla(${hue - 6},50%,${28 + Math.random() * 16}%,${0.07 + Math.random() * 0.14})`;
    g.lineWidth = 0.5 + Math.random() * 1.8;
    const a = 2 + Math.random() * 6, f = 0.004 + Math.random() * 0.018, ph = Math.random() * 6;
    g.beginPath();
    for (let x = 0; x <= w + 8; x += 8) g.lineTo(x, y + Math.sin(x * f + ph) * a);
    g.stroke();
  }
  if (w > 180 && h > 80) {
    const kx = w * rand(0.15, 0.85), ky = h * rand(0.25, 0.75);
    for (let r = 16; r > 2; r -= 3) {
      g.strokeStyle = `hsla(${hue - 10},45%,28%,0.22)`; g.lineWidth = 1.6;
      g.beginPath(); g.ellipse(kx, ky, r * 1.9, r * 0.75, 0, 0, 7); g.stroke();
    }
  }
  return c;
}
function steelTex(w, h, shade) {
  const { c, g } = makeCanvas(w, h);
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, `hsl(210,8%,${shade + 8}%)`);
  grad.addColorStop(0.5, `hsl(210,6%,${shade - 4}%)`);
  grad.addColorStop(1, `hsl(210,8%,${shade + 4}%)`);
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  for (let i = 0; i < h * 1.4; i++) {
    const y = Math.random() * h;
    g.strokeStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${rand(.03, .09)})`;
    g.lineWidth = rand(.4, 1.2);
    g.beginPath(); const x0 = rand(-50, w); g.moveTo(x0, y); g.lineTo(x0 + rand(40, 200), y); g.stroke();
  }
  return c;
}
function drawSlab(b, tex, edge = '#7a4a22', sx = 0, sw = null) {
  sw = sw ?? b.w;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 12;
  ctx.fillStyle = edge; ctx.fillRect(b.x, b.y + 6, b.w, b.h + 3);
  ctx.restore();
  ctx.drawImage(tex, sx * DPR, 0, sw * DPR, b.h * DPR, b.x, b.y, b.w, b.h);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(b.x, b.y, b.w, 2);
}

/* ---------- sound + buzz ---------- */
let AC = null, master = null, noiseBuf = null, soundOn = true;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return AC; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(AC.destination);
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
  return AC;
}
function env(g, t, a, peak, dec) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function tone(freq, type, peak, dec, slideTo, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dec);
  env(g, t, 0.005, peak, dec); o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dec + 0.05);
}
function noise(peak, dec, ftype, freq, q = 1) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource();
  s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); env(g, t, 0.004, peak, dec);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random()); s.stop(t + dec + 0.05);
}
function noiseLoop(ftype, freq, q = 1) {
  if (!AC) return null;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = 0;
  s.connect(f); f.connect(g); g.connect(master); s.start();
  return { g, f, stop() { try { g.gain.setTargetAtTime(0, AC.currentTime, 0.03); setTimeout(() => { try { s.stop(); } catch (e) {} }, 300); } catch (e) {} } };
}
function oscLoop(type, freq) {
  if (!AC) return null;
  const o = AC.createOscillator(); o.type = type; o.frequency.value = freq;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  const g = AC.createGain(); g.gain.value = 0;
  o.connect(f); f.connect(g); g.connect(master); o.start();
  return { o, g, f, stop() { try { g.gain.setTargetAtTime(0, AC.currentTime, 0.04); setTimeout(() => { try { o.stop(); } catch (e) {} }, 300); } catch (e) {} } };
}
const sfx = {
  thunk(d = 0) { tone(150 - d * 40, 'sine', 0.8, 0.2, 55); noise(0.45, 0.06, 'bandpass', 1700, 1.2); tone(900 + d * 500, 'triangle', 0.12, 0.08); },
  tock() { tone(220, 'sine', 0.5, 0.12, 90); noise(0.3, 0.05, 'bandpass', 900, 1); },
  clink() { tone(1900, 'triangle', 0.25, 0.3); tone(2850, 'sine', 0.1, 0.35); },
  rasp(dir) { noise(0.5, 0.13, 'bandpass', dir > 0 ? 1300 : 1900, 2.2); },
  clunk() { tone(110, 'sine', 0.9, 0.35, 45); noise(0.5, 0.12, 'lowpass', 600, 1); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 'triangle', 0.22, 0.3, null, i * 0.09)); },
  pop() { tone(500, 'sine', 0.3, 0.08, 900); },
  clang() { tone(1250, 'triangle', 0.35, 0.45); tone(1900, 'sine', 0.18, 0.6); noise(0.4, 0.05, 'bandpass', 2500, 1); tone(140, 'sine', 0.4, 0.12, 70); },
  ting() { tone(2400, 'sine', 0.25, 0.25); tone(3600, 'sine', 0.1, 0.2); },
  ring() { tone(2100, 'sine', 0.3, 1.2); tone(3150, 'sine', 0.12, 0.9); tone(1050, 'triangle', 0.15, 0.5); },
  hiss(hot) { noise(hot ? 0.55 : 0.15, hot ? 1.5 : 0.35, 'highpass', 3200, 0.5); },
  whoosh() { noise(0.5, 0.7, 'lowpass', 600, 0.7); },
};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* ---------- particles ---------- */
let parts = [];
function spawn(o) { if (parts.length < 900) parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, size: 3, rot: 0, vr: 0, drag: 0 }, o, { max: o.life ?? 1 })); }
function celebrate(x, y) {
  const cols = ['#ffd34d', '#ff7a3d', '#4fb3ff', '#7bdc5a', '#ff5c8a', '#fff4de'];
  for (let i = 0; i < 46; i++) {
    const a = rand(0, Math.PI * 2), s = rand(150, 480);
    spawn({ kind: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 220, g: 700, life: rand(0.9, 1.6), size: rand(5, 10), color: cols[i % cols.length], vr: rand(-8, 8) });
  }
  sfx.yay(); buzz([30, 50, 30, 50, 60]);
}
function star(g, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r, a = i * Math.PI / 5 - Math.PI / 2; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function updateParts(dt) {
  for (const p of parts) {
    p.vy += p.g * dt; p.vx *= (1 - p.drag * dt); p.vy *= (1 - p.drag * dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    if (p.kind === 'steam') p.size += dt * 22;
    if (p.kind === 'ring') p.size += dt * (p.grow || 40);
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 60);
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.kind === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,${180 + a * 75 | 0},${80 + a * 150 | 0},${a})`;
      ctx.lineWidth = 2; ctx.rotate(-p.rot);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-p.vx * 0.025, -p.vy * 0.025); ctx.stroke();
    } else if (p.kind === 'star') {

function heatColor(a) {

  { name: 'Green frog', call: 'banjo', color: '#79b347', spot: '#4d8a2c', sac: '#f2ecc4', size: 1.05, rate: 8, pair: false },
  { name: 'Spring peeper', call: 'peep', color: '#c99a62', spot: '#7a5530', sac: '#f4e3c8', size: 0.72, rate: 10, pair: false, cross: true },
  { name: 'Tree frog', call: 'trill', color: '#9fd06a', spot: '#6fa040', sac: '#f3f0d0', size: 0.82, rate: 28, pair: false, stripe: true },
  { name: 'Toad', call: 'toad', color: '#9a7a52', spot: '#6a5236', sac: '#efe2c4', size: 1.12, rate: 36, pair: false, bumps: true },
  { name: 'Leopard frog', call: 'ribbit', color: '#8cc06a', spot: '#2f5a22', sac: '#e8f0d8', size: 0.98, rate: 14, pair: true, big: true },
];
scenes.frogs = {
  hint: 'Tap a frog to hear it croak',
  pondR(a) { return 1 + 0.045 * Math.sin(3 * a + 1) + 0.03 * Math.sin(5 * a + 2) + 0.02 * Math.sin(8 * a); },
  pondPath(k, pad = 0) {
    const p = new Path2D(), P = this.P;
    for (let i = 0; i <= 120; i++) {
      const a = i / 120 * Math.PI * 2, r = this.pondR(a);
      const x = P.cx + Math.cos(a) * (P.rx * r * k + pad), y = P.cy + Math.sin(a) * (P.ry * r * k + pad);
      i ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath(); return p;
  },
  inWater(x, y) {
    const P = this.P, dx = (x - P.cx) / P.rx, dy = (y - P.cy) / P.ry;
    return Math.hypot(dx, dy) < this.pondR(Math.atan2(dy, dx)) * 0.97;
  },
  init() {
    const P = this.P = { cx: W / 2, cy: H * 0.5, rx: W * 0.38, ry: Math.min(H * 0.33, W * 0.6) };
    this.water = this.pondPath(1); this.shore = this.pondPath(1, 26);
    const { c, g } = makeCanvas(W, H);
    g.fillStyle = '#5d9a3e'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 1400; i++) {
      const x = rand(0, W), y = rand(0, H);
      g.strokeStyle = Math.random() < .5 ? 'rgba(40,90,30,.45)' : 'rgba(140,200,90,.35)'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(-3, 3), y - rand(4, 9)); g.stroke();
    }
    g.fillStyle = '#8a6b45'; g.fill(this.shore);
    for (let i = 0; i < 160; i++) {
      const a = rand(0, 7), r = this.pondR(a), k = rand(1, 1.0) ;
      const x = P.cx + Math.cos(a) * (P.rx * r + rand(4, 24)), y = P.cy + Math.sin(a) * (P.ry * r + rand(4, 24));
      g.fillStyle = Math.random() < .5 ? 'rgba(170,150,120,.7)' : 'rgba(90,70,45,.6)';
      g.beginPath(); g.ellipse(x, y, rand(1.5, 4), rand(1, 3), rand(0, 3), 0, 7); g.fill();
    }
    const wg = g.createRadialGradient(P.cx, P.cy, 10, P.cx, P.cy, Math.max(P.rx, P.ry));
    wg.addColorStop(0, '#3a8fb2'); wg.addColorStop(.75, '#2a7090'); wg.addColorStop(1, '#1f5670');
    g.fillStyle = wg; g.fill(this.water);
    g.save(); g.clip(this.water);
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 4; g.stroke(this.pondPath(0.985));
    g.restore();
    // cattails along the shore
    for (const a0 of [-2.0, -0.2, 1.3, 2.7]) {
      for (let i = 0; i < 6; i++) {
        const a = a0 + rand(-0.15, 0.15), r = this.pondR(a);
        const bx = P.cx + Math.cos(a) * (P.rx * r + 18), by = P.cy + Math.sin(a) * (P.ry * r + 18);
        const la = a + rand(-0.6, 0.6), len = rand(26, 44);
        g.strokeStyle = '#3f7a2a'; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + Math.cos(la) * len, by + Math.sin(la) * len); g.stroke();
        if (i % 2 === 0) { g.fillStyle = '#7a4a22'; g.beginPath(); g.ellipse(bx + Math.cos(la) * len * .7, by + Math.sin(la) * len * .7, 8, 3.5, la, 0, 7); g.fill(); }
      }
    }
    this.bg = c;
    const sz = Math.min(W, H) / 320;
    const shoreAt = a => { const r = this.pondR(a); return { x: P.cx + Math.cos(a) * (P.rx * r + 14), y: P.cy + Math.sin(a) * (P.ry * r + 14) }; };
    const spots = [
      { ...shoreAt(-2.45), pad: false }, { ...shoreAt(-0.65), pad: false }, { ...shoreAt(1.95), pad: false },
      { x: P.cx - P.rx * .4, y: P.cy - P.ry * .3, pad: true }, { x: P.cx + P.rx * .35, y: P.cy + P.ry * .05, pad: true }, { x: P.cx - P.rx * .1, y: P.cy + P.ry * .48, pad: true },
    ];
    this.pads = [
      { x: P.cx + P.rx * .45, y: P.cy - P.ry * .55, r: 20 * sz, rot: 1.2, fl: true }, { x: P.cx - P.rx * .55, y: P.cy + P.ry * .2, r: 18 * sz, rot: 3 },
      { x: P.cx + P.rx * .1, y: P.cy - P.ry * .1, r: 14 * sz, rot: 5 },
    ];
    this.frogs = FROGS.map((d, i) => {
      const s = spots[i], scale = 22 * d.size * sz;
      const ang = s.pad ? rand(0, 7) : Math.atan2(P.cy - s.y, P.cx - s.x);
      if (s.pad) this.pads.push({ x: s.x, y: s.y, r: scale * 1.55, rot: rand(0, 7) });
      return { ...d, x: s.x, y: s.y, s: scale, ang, croakT: -9, croakDur: 0, blinkT: now + rand(1, 5), spots: Array.from({ length: d.big ? 6 : 4 }, () => ({ x: rand(-.5, .5), y: rand(-.2, .9), r: rand(.1, d.big ? .22 : .14) })) };
    });
    this.nextAuto = now + rand(6, 10);
  },
  croak(f, quiet) {
    if (!AC) return;
    const old = master.gain.value;
    const dur = FROG_CALLS[f.call]();
    f.croakT = now; f.croakDur = dur;
    if (!quiet) { buzz([30, 30, 30]); say(f.name + '!', 2000); }
    for (let i = 0; i < 2; i++) spawn({ kind: 'ring', x: f.x, y: f.y, size: f.s * 1.2 + i * 8, grow: 50, life: .8 });
  },
  down(p) {
    const fp = { x: p.fx, y: p.fy };
    let best = null, bd = 1e9;
    for (const f of this.frogs) { const d = dist(fp, f); if (d < f.s * 1.6 + 14 && d < bd) { bd = d; best = f; } }
    if (best) { this.croak(best); return; }
    if (this.inWater(fp.x, fp.y)) {
      for (let i = 0; i < 3; i++) spawn({ kind: 'ring', x: fp.x, y: fp.y, size: 4 + i * 7, grow: 55, life: 1.1 });
      for (let i = 0; i < 4; i++) spawn({ kind: 'bubble', x: fp.x + rand(-8, 8), y: fp.y + rand(-8, 8), life: rand(.4, .8), size: rand(1.5, 3) });
      tone(rand(480, 620), 'sine', 0.35, 0.12, 190); buzz(15);
    }
  },
  drawFrog(f) {
    const s = f.s, el = now - f.croakT, on = el < f.croakDur;
    const hop = el < 0.25 ? Math.sin(el / 0.25 * Math.PI) : 0;
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ang + Math.PI / 2); ctx.scale(1 + hop * .12, 1 + hop * .12);
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(s * .15, s * .3, s * .95, s * 1.15, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(20,40,10,.55)'; ctx.lineWidth = 1.5;
    // back legs folded at the sides
    ctx.fillStyle = f.spot;
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sx * s * .72, s * .55, s * .32, s * .62, sx * .45, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx * s * .55, s * 1.05); ctx.lineTo(sx * s * 1.0, s * 1.25); ctx.lineTo(sx * s * .7, s * 1.3); ctx.lineTo(sx * s * .45, s * 1.25); ctx.closePath(); ctx.fill();
    }
    // front legs
    ctx.fillStyle = f.color;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * s * .62, -s * .22, s * .14, s * .32, sx * -.5, 0, 7); ctx.fill(); ctx.stroke(); }
    // vocal sac
    if (on) {
      const amt = 0.55 + 0.45 * Math.abs(Math.sin(el * f.rate));
      ctx.fillStyle = f.sac; ctx.globalAlpha = .95;
      if (f.pair) { for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * s * .62, -s * .62, s * .32 * amt, 0, 7); ctx.fill(); ctx.stroke(); } }
      else { ctx.beginPath(); ctx.arc(0, -s * 1.0, s * .5 * amt, 0, 7); ctx.fill(); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    // body + head
    const bg = ctx.createRadialGradient(-s * .2, -s * .2, s * .1, 0, 0, s * 1.1);
    bg.addColorStop(0, f.color); bg.addColorStop(1, f.spot);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, s * .15, s * .72, s * .92, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -s * .55, s * .6, s * .48, 0, 0, 7); ctx.fill();
    ctx.fillStyle = f.spot;
    for (const p of f.spots) { ctx.beginPath(); ctx.arc(p.x * s, p.y * s, p.r * s, 0, 7); ctx.fill(); }
    if (f.bumps) { ctx.fillStyle = 'rgba(60,40,20,.45)'; for (let i = 0; i < 14; i++) { const a = i * 2.39, r = (i % 5) / 5 * .6; ctx.beginPath(); ctx.arc(Math.cos(a) * r * s, s * .15 + Math.sin(a) * r * s * 1.2, s * .06, 0, 7); ctx.fill(); } }
    if (f.cross) { ctx.strokeStyle = f.spot; ctx.lineWidth = s * .1; ctx.beginPath(); ctx.moveTo(-s * .35, -s * .1); ctx.lineTo(s * .35, s * .6); ctx.moveTo(s * .35, -s * .1); ctx.lineTo(-s * .35, s * .6); ctx.stroke(); }
    if (f.stripe) { ctx.strokeStyle = 'rgba(255,255,240,.8)'; ctx.lineWidth = s * .07; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * s * .5, -s * .75); ctx.quadraticCurveTo(sx * s * .7, -s * .3, sx * s * .62, s * .1); ctx.stroke(); } }
    // eyes
    const blink = now > f.blinkT && now < f.blinkT + 0.15;
    if (now > f.blinkT + 0.15) f.blinkT = now + rand(2, 6);
    for (const sx of [-1, 1]) {
      ctx.fillStyle = f.color; ctx.strokeStyle = 'rgba(20,40,10,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx * s * .34, -s * .72, s * .22, 0, 7); ctx.fill(); ctx.stroke();
      if (blink) { ctx.strokeStyle = '#1d1d1d'; ctx.beginPath(); ctx.moveTo(sx * s * .34 - s * .14, -s * .72); ctx.lineTo(sx * s * .34 + s * .14, -s * .72); ctx.stroke(); }
      else {
        ctx.fillStyle = '#e8c24a'; ctx.beginPath(); ctx.arc(sx * s * .34, -s * .74, s * .15, 0, 7); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(sx * s * .34, -s * .74, s * .1, s * .045, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(sx * s * .34 - s * .05, -s * .79, s * .035, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
  },
  draw(dt) {
    ctx.drawImage(this.bg, 0, 0, W, H);
    shimmer(now, 0.06, this.water);
    for (const p of this.pads) drawPad(p.x, p.y + Math.sin(now * .8 + p.rot) * 1.2, p.r, p.rot, p.fl);
    for (const f of this.frogs) this.drawFrog(f);
    if (AC && now > this.nextAuto) {
      this.nextAuto = now + rand(7, 12);
      const quietOnes = this.frogs.filter(f => now - f.croakT > 3);
      if (quietOnes.length && soundOn) {
        const f = quietOnes[Math.random() * quietOnes.length | 0];
        const old = master.gain.value; master.gain.value = old * 0.5; this.croak(f, true);
        setTimeout(() => { if (master) master.gain.value = soundOn ? 0.9 : 0; }, f.croakDur * 1000 + 100);
      }
    }
  },
};

/* ================= YARD ================= */
const CHIME = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
scenes.fireflies = {
  hint: 'Tap a lightning bug!',
  init() {
    const hz = H * 0.66;
    this.hz = hz;
    const { c, g } = makeCanvas(W, H);
    const sky = g.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, '#070d22'); sky.addColorStop(.7, '#132048'); sky.addColorStop(1, '#22305e');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    // moon
    const mx = W * 0.8, my = H * 0.12, mr = Math.min(W, H) * 0.06;
    const mg = g.createRadialGradient(mx, my, mr * .5, mx, my, mr * 4);
    mg.addColorStop(0, 'rgba(255,250,220,.35)'); mg.addColorStop(1, 'rgba(255,250,220,0)');
    g.fillStyle = mg; g.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    g.fillStyle = '#fdf6d8'; g.beginPath(); g.arc(mx, my, mr, 0, 7); g.fill();
    g.fillStyle = 'rgba(200,190,160,.35)';
    for (const [dx, dy, r] of [[-.3, -.2, .22], [.25, .2, .16], [.1, -.4, .1]]) { g.beginPath(); g.arc(mx + dx * mr, my + dy * mr, r * mr, 0, 7); g.fill(); }
    // treeline
    g.fillStyle = '#0d1630';
    g.beginPath(); g.moveTo(0, hz);
    for (let x = 0; x <= W + 30; x += 26) g.arc(x, hz - rand(18, 52), rand(22, 36), Math.PI, 0);
    g.lineTo(W, hz + 10); g.lineTo(0, hz + 10); g.closePath(); g.fill();
    // house with a warm window
    const hx = W * 0.08, hw = Math.min(W * 0.34, 170), hh = hw * 0.62, hy = hz - hh + 6;
    g.fillStyle = '#0a1124';
    g.fillRect(hx, hy, hw, hh); g.beginPath(); g.moveTo(hx - 10, hy); g.lineTo(hx + hw / 2, hy - hw * .38); g.lineTo(hx + hw + 10, hy); g.fill();
    g.fillRect(hx + hw * .7, hy - hw * .34, hw * .1, hw * .2);
    const wx = hx + hw * .2, wy = hy + hh * .25, ww = hw * .22, wh = hh * .32;
    const wl = g.createRadialGradient(wx + ww / 2, wy + wh / 2, 2, wx + ww / 2, wy + wh / 2, ww * 2.2);
    wl.addColorStop(0, 'rgba(255,200,110,.45)'); wl.addColorStop(1, 'rgba(255,200,110,0)');
    g.fillStyle = wl; g.fillRect(wx - ww * 2, wy - ww * 2, ww * 5, ww * 5);
    g.fillStyle = '#ffcf7a'; g.fillRect(wx, wy, ww, wh);
    g.fillStyle = '#0a1124'; g.fillRect(wx + ww / 2 - 1.5, wy, 3, wh); g.fillRect(wx, wy + wh / 2 - 1.5, ww, 3);
    // fence
    g.fillStyle = '#121c38';
    for (let x = hx + hw + 18; x < W; x += 16) { g.beginPath(); g.moveTo(x, hz + 6); g.lineTo(x, hz - 30); g.lineTo(x + 5, hz - 36); g.lineTo(x + 10, hz - 30); g.lineTo(x + 10, hz + 6); g.fill(); }
    g.fillRect(hx + hw + 14, hz - 24, W, 5); g.fillRect(hx + hw + 14, hz - 10, W, 5);
    // lawn
    const lawn = g.createLinearGradient(0, hz, 0, H);
    lawn.addColorStop(0, '#0f2a1e'); lawn.addColorStop(1, '#081810');
    g.fillStyle = lawn; g.fillRect(0, hz, W, H - hz);
    this.bg = c;
    // tall grass in front
    const f = makeCanvas(W, H);
    for (let i = 0; i < W * 1.6; i++) {
      const x = rand(0, W), base = H + 4, h = rand(24, 70);
      f.g.strokeStyle = Math.random() < .5 ? '#06120b' : '#0b1e14'; f.g.lineWidth = rand(1.5, 3);
      f.g.beginPath(); f.g.moveTo(x, base); f.g.quadraticCurveTo(x + rand(-6, 6), base - h * .6, x + rand(-14, 14), base - h); f.g.stroke();
    }
    this.front = f.c;
    this.stars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, hz - 40), r: rand(.5, 1.6), ph: rand(0, 7), sp: rand(1, 3) }));
    this.bugs = [];
    for (let i = 0; i < 14; i++) this.bugs.push(this.makeBug());
    this.nextChirp = now + 1;
  },
  makeBug(x, y) {
    return {
      x: x ?? rand(W * .05, W * .95), y: y ?? rand(H * .25, H * .9),
      a: rand(0, 7), sp: rand(12, 26), ph: rand(0, 7),
      t: rand(0, 3), off: rand(1, 3.5), born: now, gone: 0,
      hue: rand(62, 80),
    };
  },
  bright(b) {
    // fade in, hold, fade out, then dark for a while
    const inT = 0.6, hold = 0.35, outT = 0.9, cyc = inT + hold + outT + b.off;
    const t = b.t % cyc;
    if (t < inT) return t / inT;
    if (t < inT + hold) return 1;
    if (t < inT + hold + outT) return 1 - (t - inT - hold) / outT;
    return 0;
  },
  burst(b) {
    const x = b.x, y = b.y, h0 = rand(0, 360);
    spawn({ kind: 'flash', x, y, size: 50, life: 0.5 });
    for (let i = 0; i < 46; i++) {
      const a = rand(0, Math.PI * 2), s = rand(70, 280), hue = (h0 + rand(-60, 60) + (i % 3) * 120) % 360;
      spawn({ kind: 'glow', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 45, drag: 1.4, life: rand(.8, 1.7), size: rand(2, 4.2), color: `hsl(${hue},100%,66%)` });
    }
    for (let i = 0; i < 10; i++) {
      const a = rand(0, Math.PI * 2), s = rand(60, 180);
      spawn({ kind: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 30, drag: 1.2, life: rand(.9, 1.5), size: rand(4, 7), color: `hsl(${(h0 + i * 36) % 360},100%,72%)`, vr: rand(-6, 6) });
    }
    spawn({ kind: 'ring', x, y, size: 10, grow: 160, life: .6, lw: 2.5 });
    // every burst plays its own little tune
    const types = ['sine', 'triangle'], n = 2 + (Math.random() * 2 | 0);
    let idx = Math.random() * (CHIME.length - 3) | 0;
    const type = types[Math.random() * 2 | 0];
    for (let i = 0; i < n; i++) {
      tone(CHIME[idx], type, 0.28, 0.45, null, i * rand(0.05, 0.09));
      idx = clamp(idx + (Math.random() < .5 ? 1 : 2) * (Math.random() < .75 ? 1 : -1), 0, CHIME.length - 1);
    }
    tone(rand(250, 400), 'sine', 0.3, 0.1, rand(800, 1200));
    noise(0.12, 0.35, 'highpass', 6500, 0.5);
    buzz([20, 30, 40]);
    b.gone = now;
  },
  down(p) {
    const f = { x: p.fx, y: p.fy };
    let best = null, bd = 50;
    for (const b of this.bugs) { if (b.gone) continue; const d = dist(f, b); if (d < bd) { bd = d; best = b; } }
    if (best) { this.burst(best); return; }
    if (f.y < H - 10 && this.bugs.filter(b => !b.gone).length < 24) {
      const nb = this.makeBug(f.x, f.y); nb.t = 0; this.bugs.push(nb);
      tone(rand(900, 1300), 'sine', 0.12, 0.25); buzz(10);
    }
  },
  draw(dt) {
    ctx.drawImage(this.bg, 0, 0, W, H);
    for (const s of this.stars) {
      const tw = 0.45 + 0.55 * Math.abs(Math.sin(now * s.sp + s.ph));
      ctx.fillStyle = `rgba(255,255,240,${tw})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const b of this.bugs) {
      if (b.gone) continue;
      b.t += dt; b.a += rand(-1, 1) * dt * 2.2; b.ph += dt * 3;
      b.x += Math.cos(b.a) * b.sp * dt; b.y += Math.sin(b.a) * b.sp * dt + Math.sin(b.ph) * 6 * dt;
      if (b.x < 10 || b.x > W - 10) b.a = Math.PI - b.a;
      if (b.y < H * .18 || b.y > H * .93) b.a = -b.a;
      b.x = clamp(b.x, 8, W - 8); b.y = clamp(b.y, H * .16, H * .95);
      const fadeIn = Math.min(1, (now - b.born) / 0.6), br = this.bright(b) * fadeIn;
      if (br > 0.01) {
        const r = 10 + 26 * br, gl = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
        gl.addColorStop(0, `hsla(${b.hue},100%,70%,${0.7 * br})`); gl.addColorStop(.35, `hsla(${b.hue},100%,60%,${0.3 * br})`); gl.addColorStop(1, `hsla(${b.hue},100%,55%,0)`);
        ctx.fillStyle = gl; ctx.fillRect(b.x - r, b.y - r, r * 2, r * 2);
        ctx.fillStyle = `hsla(${b.hue},100%,88%,${br})`; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill();
      }
    }
    ctx.restore();

    }
    if (P > .95 && now > this.nextFirework) { this.nextFirework = now + rand(0.8, 1.6); this.firework(); }
    // cable from the wheel's generator to the city
    const cb = this.cable;
    ctx.strokeStyle = '#1b1b1d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); cb.pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
    ctx.strokeStyle = '#5a5048'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W * .92, gy + 30); ctx.lineTo(W * .92, gy - 36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W * .92 - 10, gy - 30); ctx.lineTo(W * .92 + 10, gy - 30); ctx.stroke();
    ctx.strokeStyle = '#1b1b1d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W * .92, gy - 30); ctx.quadraticCurveTo(W * .7, gy - 10, (this.bldg[this.bldg.length - 1]?.x ?? W * .8) + 5, gy - 40); ctx.stroke();

    const dg = ctx.createRadialGradient(-T.R * .2, -T.R * .2, 4, 0, 0, T.R * .8);

    for (let i = 0; i < 16; i++) {

      const cg = ctx.createLinearGradient(-8, 0, 8, 0); cg.addColorStop(0, '#d8a54a'); cg.addColorStop(1, '#8a6420');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(0, 0, T.R * .16, T.R * .12, 0, -Math.PI / 2, Math.PI / 2, true); ctx.closePath(); ctx.fill();

    }
    ctx.strokeStyle = 'rgba(40,45,50,.6)'; ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * T.R * .2, Math.sin(a) * T.R * .2); ctx.lineTo(Math.cos(a) * T.R * .7, Math.sin(a) * T.R * .7); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#3d6fb0'; ctx.beginPath(); ctx.arc(T.x, T.y, T.R * .26, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff4de'; ctx.font = `${Math.max(8, T.R * .14)}px 'Bungee', 'Arial Black', sans-serif`; ctx.textAlign = 'center'; ctx.fillText('GEN', T.x, T.y + T.R * .05);
    if (w > 3 && Math.random() < w / 40) { const a = rand(0, 7); spawn({ kind: 'dust', x: T.x + Math.cos(a) * T.R, y: T.y + Math.sin(a) * T.R, vx: -Math.sin(a) * this.omega * T.R * .6, vy: Math.cos(a) * this.omega * T.R * .6, g: 700, life: .6, size: rand(1.2, 2.4), color: 'rgba(180,225,255,.9)' }); }
    // spray
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(170,220,255,.75)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';

    ctx.restore();

    const back = { x: noz.x - Math.cos(aim) * 30, y: noz.y - Math.sin(aim) * 30 };
    ctx.beginPath(); ctx.moveTo(-10, H + 10); ctx.quadraticCurveTo(W * .1, back.y + 80, back.x, back.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, H + 6); ctx.quadraticCurveTo(W * .1, back.y + 76, back.x, back.y - 4); ctx.stroke();

    ctx.fillStyle = '#c8952e'; ctx.beginPath(); ctx.moveTo(-30, -8); ctx.lineTo(18, -5); ctx.lineTo(26, -3); ctx.lineTo(26, 3); ctx.lineTo(18, 5); ctx.lineTo(-30, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9a6f1e'; for (const xx of [-22, -14]) ctx.fillRect(xx, -9, 4, 18);

let digDrag = null;

[['worm', DIG_COLORS], ['mole', MOLE_COLORS]].forEach(([set, list]) => list.forEach((c, i) => {

/* ---------- places + tool switching ---------- */
const PLACES = {
  workshop: { label: 'Workshop', first: 'hammer', reset: 'New board' },
  pond: { label: 'Pond', first: 'lures', reset: 'Start over' },
  yard: { label: 'Yard', first: 'fireflies', reset: 'Start over' },
  science: { label: 'Science', first: 'generator', reset: 'Start over' },
};
let place = null, lastTool = {};
let current = 'hammer', ready = {}, hintTimer = null;
function scene() { return scenes[current]; }
function ensure(name) { if (!ready[name] && W > 0) { scenes[name].init(); ready[name] = true; } }
function say(text, ms = 3500) {
  hintEl.textContent = text; hintEl.classList.remove('gone');
  clearTimeout(hintTimer); hintTimer = setTimeout(() => hintEl.classList.add('gone'), ms);
}
function showHint() { say(scene().hint, 4000); }
function setTool(name) {
  leaveScene();
  current = name; parts = []; if (place) lastTool[place] = name;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === name));
  swEl.hidden = name !== 'paint';
  luresEl.hidden = name !== 'lures';
  document.getElementById('lureBtns').hidden = name !== 'lures';
  document.getElementById('boxTabs').hidden = name !== 'lures';
  pansEl.hidden = name !== 'pans';
  weldEl.hidden = name !== 'welder';
  mowerEl.hidden = name !== 'mower';
  digEl.hidden = name !== 'dig';
  document.getElementById('digBtns').hidden = name !== 'dig';
  document.getElementById('digTabs').hidden = name !== 'dig';
  document.getElementById('hammerBtn').hidden = name !== 'powerhammer';
  ensure(name); showHint();
}
const homeEl = document.getElementById('home'), titleEl = document.getElementById('title');
const backBtn = document.getElementById('backBtn'), newBtn = document.getElementById('newBtn'), hdr = document.getElementById('hdr');
function leaveScene() {
  if (!place) return;
  if (scene().up) scene().up();
  if (scene().leave) scene().leave();
  ptr.down = false; ptr.id = null;
}
function openPlace(name) {
  if (!PLACES[name]) return;
  place = name; stage.dataset.place = name; homeEl.hidden = true;
  backBtn.hidden = false; newBtn.hidden = false; newBtn.textContent = PLACES[name].reset; hdr.classList.add('inplace');
  titleEl.innerHTML = `Odie's <span>${PLACES[name].label}</span>`;
  document.querySelectorAll('nav.tray').forEach(n => { n.hidden = n.dataset.place !== name; });
  setTool(lastTool[name] || PLACES[name].first);
}
function goHome() {
  leaveScene();
  place = null; stage.dataset.place = 'home'; homeEl.hidden = false; parts = [];
  backBtn.hidden = true; newBtn.hidden = true; hdr.classList.remove('inplace');
  titleEl.innerHTML = "Odie's <span>World</span>";
  document.querySelectorAll('nav.tray').forEach(n => { n.hidden = true; });
  swEl.hidden = true; luresEl.hidden = true; document.getElementById('lureBtns').hidden = true; document.getElementById('boxTabs').hidden = true; pansEl.hidden = true; weldEl.hidden = true; mowerEl.hidden = true; digEl.hidden = true; document.getElementById('digBtns').hidden = true; document.getElementById('digTabs').hidden = true; document.getElementById('hammerBtn').hidden = true;
  say('Where do you want to play?', 3000);
}
homeEl.addEventListener('click', e => {
  const b = e.target.closest('.place'); if (!b) return;
  audio(); buzz(15);
  if (b.classList.contains('soon')) { sfx.ting(); say(`The ${b.dataset.place} is coming soon!`); return; }
  sfx.pop(); openPlace(b.dataset.place);
});
backBtn.addEventListener('click', () => { audio(); sfx.pop(); goHome(); });
document.querySelectorAll('nav.tray').forEach(n => n.addEventListener('click', e => {
  const b = e.target.closest('.tool'); if (!b) return;

}));

});
const sndBtn = document.getElementById('sndBtn');
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn; audio();
  if (master) master.gain.value = soundOn ? 0.9 : 0;
  document.getElementById('sndOn').setAttribute('visibility', soundOn ? 'visible' : 'hidden');
  document.getElementById('sndOff').setAttribute('visibility', soundOn ? 'hidden' : 'visible');

  sndBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
});

/* ---------- pointer events ---------- */
// On touch, the tool works a little above the finger so the finger never hides it.
const LIFT = 64;
function pos(e) {
  const r = cv.getBoundingClientRect(), fx = e.clientX - r.left, fy = e.clientY - r.top;
  const off = e.pointerType === 'mouse' ? 0 : LIFT;
  return { x: fx, y: fy - off, fx, fy };
}
cv.addEventListener('pointerdown', e => {
  if (!place || (ptr.id !== null && ptr.id !== e.pointerId)) return;
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = pos(e); Object.assign(ptr, p, { down: true, seen: true, id: e.pointerId });
  hintEl.classList.add('gone');
  scene().down && scene().down(p);
});
cv.addEventListener('pointermove', e => {
  if (!place || (ptr.id !== null && ptr.id !== e.pointerId)) return;
  const p = pos(e); Object.assign(ptr, p); ptr.seen = true;
  scene().move && scene().move(p);
});
function end(e) {
  if (ptr.id !== e.pointerId) return;
  ptr.down = false; ptr.id = null;
  if (place) scene().up && scene().up();
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- sizing + loop ---------- */
function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const changed = Math.abs(r.width - W) > 30 || Math.abs(r.height - H) > 30;
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (changed) { ready = {}; parts = []; }
  if (place) ensure(current);
}
new ResizeObserver(resize).observe(stage);
resize(); goHome();

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t; now = t / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (place && ready[current]) scene().draw(dt);
  if (ptr.down && ptr.fy - ptr.y > 1 && (current === 'drill' || current === 'welder' || current === 'paint')) {
    ctx.save(); ctx.strokeStyle = 'rgba(255,244,222,.35)'; ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(ptr.fx, ptr.fy - 24); ctx.lineTo(ptr.x, ptr.y + 8); ctx.stroke();
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(ptr.fx, ptr.fy, 22, 0, 7); ctx.stroke(); ctx.restore();
  }
  updateParts(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
