# Builds the Android app and puts the newest copy at
# https://github.com/daniels84-prog/odies-world/releases/latest/download/odies-world.apk (Google Play bundle alongside it).
name: Android app
on:
  push:
    branches: [main]
    paths: ['app/**', 'game/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare the app's web files
        working-directory: app
        run: |
          npm ci
          npm run prep
          npx cap sync android
      - name: Build the app for the family tablet (APK)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=$((GITHUB_RUN_NUMBER + 1)) --no-daemon
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/odies-world.apk
      - name: Build the Google Play bundle (AAB), signed with the private upload key
        if: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}
        working-directory: app/android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: upload
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease -PversionCode=$((GITHUB_RUN_NUMBER + 1)) --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../../out/odies-world-google-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: odies-world-app
          path: out/
      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app out/* \
            --title "Odie's World app (build $((GITHUB_RUN_NUMBER + 1)))" \
            --notes "Download odies-world.apk on the tablet and open it to install or update. Game changes also arrive inside the app automatically when it's online." \
            --target "$GITHUB_SHA" --latest
