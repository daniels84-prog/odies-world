# Builds the Android app and puts the newest copy at
# https://github.com/daniels84-prog/odies-world/releases/latest/download/odies-world.apk
name: Android app
on:
  push:
    branches: [main]
    paths: ['app/**', 'game/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare the app's web files
        working-directory: app
        run: |
          npm ci
          npm run prep
          npx cap sync android
      - name: Build
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease -PversionCode=$((GITHUB_RUN_NUMBER + 1)) --no-daemon
      - name: Collect files
        run: |
          mkdir out
          cp app/android/app/build/outputs/apk/release/app-release.apk out/odies-world.apk
          cp app/android/app/build/outputs/bundle/release/app-release.aab out/odies-world.aab
      - uses: actions/upload-artifact@v4
        with:
          name: odies-world-app
          path: out/
      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app out/odies-world.apk \
            --title "Odie's World app (build $((GITHUB_RUN_NUMBER + 1)))" \
            --notes "Download odies-world.apk on the tablet and open it to install or update. Game changes also arrive inside the app automatically when it's online." \
            --target "$GITHUB_SHA" --latest
